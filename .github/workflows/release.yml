# Builds one zip per skill (the skill's folder at the zip's root, as Claude's Skills upload expects)
# and uploads them to one release, tag `skills`, kept as the latest release, so
# https://github.com/devgenix/fastcac-skills/releases/latest/download/<skill>.zip always serves
# the skills on main. GitHub-hosted runner: this repository is public.
name: Release skill zips

on:
  push:
    branches: [main]
    paths: ["plugins/**/skills/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

# One run at a time, in push order, so an older build never replaces a newer one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip each skill
        run: |
          mkdir -p dist
          for skill in plugins/*/skills/*/; do
            name=$(basename "$skill")
            (cd "$(dirname "$skill")" && zip -qr "$GITHUB_WORKSPACE/dist/$name.zip" "$name")
          done
          ls -l dist
      - name: Publish to the skills release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA}. Upload a zip in Claude under Customize > Skills > + > Create skill > Upload a skill."
          if gh release view skills >/dev/null 2>&1; then
            gh release upload skills dist/*.zip --clobber
            # Drop zips of skills that no longer exist (renamed or removed).
            for asset in $(gh release view skills --json assets --jq '.assets[].name'); do
              [ -f "dist/$asset" ] || gh release delete-asset skills "$asset" --yes
            done
            gh release edit skills --notes "$notes" --latest
          else
            gh release create skills dist/*.zip --target "$GITHUB_SHA" --title "Skills" --notes "$notes" --latest
          fi
